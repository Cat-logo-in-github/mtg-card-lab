<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Card Lab</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <div class="eyebrow">MAGIC: THE GATHERING</div>
      <h1>Card Lab</h1>
      <p>Describe the card you're looking for.</p>
    </header>

    <section class="search-box">
      <textarea id="query"
        placeholder="Try: cheap green creatures that make mana"></textarea>

      <div class="examples">
        <button data-query="cheap green creatures that make mana">
          Green mana
        </button>
        <button data-query="blue cards that draw cards">
          Card draw
        </button>
        <button data-query="black creatures that return from the graveyard">
          Graveyard
        </button>
        <button data-query="red spells that deal damage">
          Burn
        </button>
      </div>

      <div class="actions">
        <button id="search">Find cards</button>
        <button id="random" class="secondary">Surprise me</button>
      </div>

      <div id="interpretation"></div>
    </section>

    <div id="status"></div>

    <section id="results"></section>

    <footer>
      Card data &amp; images by
      <a href="https://scryfall.com" target="_blank">Scryfall</a>
    </footer>
  </main>

  <div id="modal" class="hidden">
      <div class="modal-content">
          <button id="close">×</button>
          <img id="modal-image">
          <div id="modal-details"></div>
          <div
              id="modal-navigation"
              style="
                  display:flex;
                  gap:10px;
                  justify-content:space-between;
                  margin-top:20px;
              "
          >
              <button
                  id="previous-card"
                  type="button"
                  style="
                      flex:1;
                      padding:12px 16px;
                      border:1px solid #302e35;
                      border-radius:8px;
                      background:#111014;
                      color:#eeeaf0;
                      font-size:14px;
                      cursor:pointer;
                  "
              >
                  ← Previous
              </button>
              <button
                  id="next-card"
                  type="button"
                  style="
                      flex:1;
                      padding:12px 16px;
                      border:1px solid #d4af67;
                      border-radius:8px;
                      background:#d4af67;
                      color:#111014;
                      font-size:14px;
                      font-weight:700;
                      cursor:pointer;
                  "
              >
                  Next →
              </button>
          </div>
      </div>
  </div>


  <script src="app.js"></script>
</body>
</html>
