<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Lab — MTG Search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <div class="eyebrow">MAGIC: THE GATHERING</div>
      <h1>Card Lab</h1>
      <p>Describe what you're looking for. We'll find the cards.</p>
    </header>

    <section class="search-box">
      <textarea id="query"
        placeholder="Try “cheap green creatures that make mana” or “blue cards that draw cards”"></textarea>

      <div class="search-row">
        <button id="search">Find Cards</button>
        <button id="random" class="secondary">Surprise Me</button>
      </div>

      <div id="interpretation"></div>
    </section>

    <section class="results-header">
      <span id="status"></span>
    </section>

    <section id="results"></section>

    <footer>
      Card data and images provided by
      <a href="https://scryfall.com" target="_blank">Scryfall</a>.
    </footer>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="close" class="close">×</button>
      <img id="modal-image" src="" alt="">
      <div id="modal-info"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
