<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Card Lab</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <div class="eyebrow">MAGIC: THE GATHERING</div>
      <h1>Card Lab</h1>
      <p>Describe the card you're looking for.</p>
    </header>

    <section class="search-box">
      <textarea id="query"
        placeholder="Try: cheap green creatures that make mana"></textarea>

      <div class="examples">
        <button data-query="cheap green creatures that make mana">
          Green mana
        </button>
        <button data-query="blue cards that draw cards">
          Card draw
        </button>
        <button data-query="black creatures that return from the graveyard">
          Graveyard
        </button>
        <button data-query="red spells that deal damage">
          Burn
        </button>
      </div>

      <div class="actions">
        <button id="search">Find cards</button>
        <button id="random" class="secondary">Surprise me</button>
      </div>

      <div id="interpretation"></div>
    </section>

    <div id="status"></div>

    <section id="results"></section>

    <footer>
      Card data &amp; images by
      <a href="https://scryfall.com" target="_blank">Scryfall</a>
    </footer>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-inner">
      <button id="close" class="close">×</button>
      <img id="modal-image" alt="">
      <div id="modal-details"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
